name: Visual QA

# Launches Uthon on real macOS machines, renders every screen in light and dark
# mode, captures the live screen (real glass), and publishes the PNGs to the
# `qa-<os>` branch so they can be reviewed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Build app
        run: ./scripts/build-dmg.sh

      - name: Functional self-test
        id: selftest
        continue-on-error: true
        run: |
          mkdir -p shots
          perl -e 'alarm 120; exec @ARGV' ./dist/Uthon.app/Contents/MacOS/Uthon --self-test "$PWD/shots/self-test.txt"

      - name: Snapshot tour (light and dark)
        id: tour
        continue-on-error: true
        run: |
          mkdir -p shots
          sw_vers > shots/os.txt
          status=0
          for mode in light dark; do
            extra=""
            [ "$mode" = dark ] && extra="--dark"
            if ! perl -e 'alarm 240; exec @ARGV' ./dist/Uthon.app/Contents/MacOS/Uthon --snapshot-tour "$PWD/shots" $extra \
                 > "shots/log-$mode.txt" 2>&1; then
              echo "tour ($mode) did not finish cleanly" | tee -a shots/os.txt
              status=1
            fi
          done
          ls -la shots
          exit $status

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p shots/crashes
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name 'Uthon*' -exec cp {} shots/crashes/ \; 2>/dev/null || true
          ls shots/crashes
          if [ -n "$(ls -A shots/crashes)" ]; then
            echo "CRASH REPORTS FOUND" | tee -a shots/os.txt
            # The exception reason is in the system log, not in the crash report.
            log show --last 20m --style compact --predicate 'process == "Uthon" AND (eventMessage CONTAINS "xception" OR eventMessage CONTAINS "Terminating" OR messageType == fault)' \
              > shots/crashes/system-log.txt 2>&1 || true
            tail -40 shots/crashes/system-log.txt
          fi

      - name: Publish screenshots to the qa branch
        if: always()
        run: |
          cd shots
          git init -q -b main
          git config user.name "uthon-qa"
          git config user.email "qa@users.noreply.github.com"
          git add -A
          git commit -qm "Visual QA on ${{ matrix.os }} for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/qa-${{ matrix.os }}

      - name: Fail if anything failed or crashed
        if: always()
        run: |
          cat shots/self-test.txt || true
          if [ "${{ steps.selftest.outcome }}" != "success" ]; then echo "Self-test failed"; exit 1; fi
          if [ "${{ steps.tour.outcome }}" != "success" ]; then echo "Snapshot tour failed"; exit 1; fi
          if [ -n "$(ls -A shots/crashes 2>/dev/null)" ]; then echo "Uthon crashed"; exit 1; fi
