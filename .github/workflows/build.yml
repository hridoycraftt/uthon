name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel   # builds the universal (Apple Silicon + Intel) app
    steps:
      - uses: actions/checkout@v4

      # Use the newest stable Xcode on the runner. With Xcode 26+ the app gets
      # Apple's real Liquid Glass on macOS 26; older macOS still gets the frosted look.
      - name: Pick newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          swift --version
          xcodebuild -version

      - name: Work out version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(cat VERSION)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app and DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Nook-dmg
          path: dist/*.dmg
          if-no-files-found: error

      # Every push to main (or a v* tag) publishes the DMG on the Releases page,
      # tagged with the version from the VERSION file. Bump VERSION for a new release;
      # pushing again without a bump refreshes that version's DMG.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Nook ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.dmg
          make_latest: true
          generate_release_notes: true
